<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSE — городской транспорт (§2 клиент)</title>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #10151c; color: #e6edf3; }
      #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      #panel { padding: 12px; overflow-y: auto; background: #161b22; border-right: 1px solid #30363d; }
      #map { position: relative; }
      #maplibre { position: absolute; inset: 0; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      h2 { font-size: 13px; margin: 14px 0 6px; color: #7d8590; text-transform: uppercase; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
      button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
      button:hover { background: #30363d; }
      button.active { outline: 2px solid #58a6ff; }
      button.primary { background: #1f6feb; border-color: #1f6feb; }
      .stat { font-size: 13px; margin: 2px 0; }
      .money { color: #3fb950; }
      .neg { color: #f85149; }
      #log { font-size: 12px; white-space: pre-wrap; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; max-height: 260px; overflow-y: auto; }
      .hint { font-size: 12px; color: #7d8590; }
    </style>
    <script type="module" crossorigin src="/assets/index-BI_YNStO.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="panel">
        <h1>PULSE <span class="hint">MVP</span></h1>
        <div class="row" id="tools">
          <button data-tool="select" class="active">Выбор</button>
          <button data-tool="station">Станция</button>
          <button data-tool="line">Линия</button>
        </div>
        <div class="row" id="modes">
          <button data-mode="bus" class="active">Автобус</button>
          <button data-mode="tram">Трамвай</button>
          <button data-mode="metro">Метро</button>
        </div>
        <div id="draftInfo" class="hint"></div>
        <h2>Год <span id="yearLabel">1</span></h2>
        <div class="stat">Капитал: <span id="capital" class="money"></span></div>
        <div class="stat">Резерв плана: <span id="reserve"></span></div>
        <div class="stat">Пассажиров/день: <span id="pax">—</span></div>
        <div class="stat">Удовлетворённость: <span id="sat">—</span></div>
        <div class="row">
          <button id="closeYear" class="primary">Закрыть год (§9.1)</button>
          <button id="undoStation">Отменить точку</button>
        </div>
        <h2>Отчёт года</h2>
        <div id="log">Постройте линию: «Станция» → клики по карте (координаты карты = метры города), затем «Линия» и «Закрыть год».</div>
      </div>
      <div id="map"><div id="maplibre"></div></div>
    </div>
  </body>
</html>
